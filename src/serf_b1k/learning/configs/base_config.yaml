defaults:
  - _self_  # all below configs will override this conf.yaml
  - robot: r1pro
  - task: behavior
  - policy: ???

env_wrapper: 
  _target_: omnigibson.learning.wrappers.RGBLowResWrapper
policy_name: ???  # filled by policy
headless: true  # whether to run in headless mode (no GUI)
eval_on_train_instances: false  # whether to eval on training instances
eval_instance_ids: null  # specific list of instance ids to eval on, if null test on all instances
write_video: true # whether we record videos during rollout
write_third_person_video: false # whether we separately record the fixed third-person view during rollout
repro_initial_state: true # whether to persist and reuse per-task/instance/episode initial simulator states
repro_action_log: true # whether to persist and reuse per-task/instance/episode executed action sequences
replay_mode: auto # none = never replay, auto = replay only when a valid complete log exists, force = require a valid replay log
replay_action_log_path: null # explicit replay source directory; null keeps per-task/instance/episode auto-discovery
replay_until_step: null # optional exclusive replay cutoff; switch to policy inference once env step >= this value
resume_record_suffix: resumed # suffix for new action-log directories when replay is active and we record resumed/fallback actions
repro_action_chunk_size: 100 # number of step actions to buffer before flushing one chunk file
record_step_q_score: true # whether to evaluate and log q_score on every simulator step
partial_scene_load: true  # whether to only load task-relevant rooms for a specific task
max_steps: null  # max steps per rollout episode, setting to null will use the default value (2 x average human demo completion steps)
log_path: ???
test_hidden: false  # [Internal use only] whether to eval on hidden test instances
